<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page-crud">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page">
    <div th:replace="~{fragments/ui :: pageHeader(${product.id != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'}, 'Thông tin sản phẩm', ~{::actions})}">
        <div th:fragment="actions">
            <a class="btn btn-secondary" href="/products">Quay lại</a>
        </div>
    </div>

    <div th:replace="~{fragments/ui :: alerts}"></div>

    <form class="form-card" th:action="${product.id} != null ? @{'/products/update/' + ${product.id}} : @{/products}"
          th:object="${product}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-grid">
            <div class="field">
                <label class="field__label" for="name">Tên</label>
                <input class="field__control" id="name" type="text" th:field="*{name}" required>
            </div>

            <div class="field">
                <label class="field__label" for="category">Danh mục</label>
                <select class="field__control" id="category" th:field="*{category.id}">
                    <option value="">Chọn danh mục</option>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:text="${c.parent != null ? c.parent.name + ' > ' + c.name : c.name}"></option>
                </select>
            </div>

            <div class="field">
                <label class="field__label" for="price">Giá</label>
                <input class="field__control" id="price" type="number" step="0.01" th:field="*{price}" required>
            </div>

            <div class="field">
                <label class="field__label" for="imageUrl">Ảnh (URL)</label>
                <input class="field__control" id="imageUrl" type="url" th:field="*{imageUrl}">
            </div>

            <div class="field">
                <label class="field__label" for="promotionType">Loại khuyến mãi</label>
                <select class="field__control" id="promotionType" th:field="*{promotionType}">
                    <option value="NONE">Không khuyến mãi</option>
                    <option value="DISCOUNT">Khuyến mãi (Giảm giá)</option>
                    <option value="GIFT">Quà tặng</option>
                </select>
            </div>

            <div class="field is-hidden" id="discountField">
                <label class="field__label" for="discountPercent">Phần trăm giảm (%)</label>
                <input class="field__control" id="discountPercent" type="number" step="0.1" min="0.1" max="100" th:field="*{discountPercent}">
            </div>

            <div class="field is-hidden" id="promoStockField">
                <label class="field__label" for="promotionQuantity">Số lượng khuyến mãi</label>
                <input class="field__control" id="promotionQuantity" type="number" min="1" th:field="*{promotionQuantity}">
                <p class="field__help">Số suất được hưởng ưu đãi (hết số này sẽ về giá gốc)</p>
            </div>

            <div class="field is-hidden" id="giftField">
                <label class="field__label" for="giftDescription">Thông tin quà tặng</label>
                <input class="field__control" id="giftDescription" type="text" th:field="*{giftDescription}">
            </div>

            <div class="field span-2">
                <label class="field__label" for="description">Mô tả</label>
                <textarea class="field__control" id="description" rows="5" th:field="*{description}"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Lưu</button>
            <a class="btn btn-secondary" href="/products">Huỷ</a>
        </div>
    </form>

    <script>
        (function () {
            function setVisible(el, visible) {
                if (!el) return;
                if (visible) {
                    el.classList.remove('is-hidden');
                } else {
                    el.classList.add('is-hidden');
                }
            }

            function togglePromotionFields() {
                var typeEl = document.getElementById('promotionType');
                var type = typeEl ? typeEl.value : 'NONE';
                
                var discountField = document.getElementById('discountField');
                var promoStockField = document.getElementById('promoStockField');
                var giftField = document.getElementById('giftField');

                var discountInput = document.getElementById('discountPercent');
                var quantityInput = document.getElementById('promotionQuantity');
                var giftInput = document.getElementById('giftDescription');

                setVisible(discountField, type === 'DISCOUNT');
                if (discountInput) discountInput.required = (type === 'DISCOUNT');

                setVisible(promoStockField, type === 'DISCOUNT' || type === 'GIFT');
                if (quantityInput) quantityInput.required = (type === 'DISCOUNT' || type === 'GIFT');

                setVisible(giftField, type === 'GIFT');
                if (giftInput) giftInput.required = (type === 'GIFT');
            }

            document.addEventListener('DOMContentLoaded', function () {
                var typeEl = document.getElementById('promotionType');
                if (typeEl) {
                    typeEl.addEventListener('change', togglePromotionFields);
                }
                togglePromotionFields();
            });
        })();
    </script>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
