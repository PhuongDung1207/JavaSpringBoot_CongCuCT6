<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý danh mục cha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page-crud">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page">
    <div th:replace="~{fragments/ui :: pageHeader('Danh mục cha','Quản lý danh mục', ~{::actions})}">
        <div th:fragment="actions">
            <a class="btn btn-primary" href="/categories/parents/add">Thêm danh mục cha</a>
        </div>
    </div>

    <div th:replace="~{fragments/ui :: alerts}"></div>

    <div th:if="${#lists.isEmpty(parents)}" class="card card-pad">
        <div class="empty-state">
            <p class="empty-state__title">Chưa có danh mục cha</p>
            <p class="empty-state__desc">Tạo danh mục cha để nhóm các danh mục con.</p>
            <a class="btn btn-primary" href="/categories/parents/add">Thêm danh mục cha</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(parents)}" class="card card--table">
        <table class="table table--zebra">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${parents}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td>
                    <div class="table__actions">
                        <a class="btn btn-secondary btn-sm" th:href="@{'/categories/parents/edit/' + ${c.id}}">Sửa</a>
                        <a class="btn btn-danger btn-sm js-confirm" th:href="@{'/categories/parents/delete/' + ${c.id}}"
                           th:attr="data-confirm=${'Bạn có chắc muốn xoá “' + c.name + '” ?'}">Xoá</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
