<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục cha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page-crud">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container page">
    <div th:replace="~{fragments/ui :: pageHeader(${category.id != null ? 'Sửa danh mục cha' : 'Thêm danh mục cha'}, null, ~{::actions})}">
        <div th:fragment="actions">
            <a class="btn btn-secondary" href="/categories/parents">Quay lại</a>
        </div>
    </div>

    <div th:replace="~{fragments/ui :: alerts}"></div>

    <form class="form-card" th:action="${category.id} != null ? @{'/categories/parents/update/' + ${category.id}} : @{'/categories/parents/add'}"
          th:object="${category}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-grid">
            <div class="field span-2">
                <label class="field__label" for="name">Tên danh mục cha</label>
                <input id="name" type="text" th:field="*{name}" required
                       class="field__control" th:classappend="${#fields.hasErrors('name')} ? ' is-error' : ''">
                <p class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Lưu</button>
            <a class="btn btn-secondary" href="/categories/parents">Huỷ</a>
        </div>
    </form>
 </main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
